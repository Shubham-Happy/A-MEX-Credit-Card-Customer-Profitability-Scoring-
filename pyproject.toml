[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amex-r1-scorecard"
version = "0.1.0"
description = "Minimal AMEX Campus Challenge R1 scorecard repository"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
